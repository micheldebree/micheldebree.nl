# === Toepasbare Regels ===

[[Experience]]
Title.nl = "Regelsysteem en services voor regelgeving m.b.t. de Omgevingswet"
Title.en = "Rule system and services for environmental legislation"
Company = "Digitaal Stelsel Omgevingswet (Rijkswaterstaat)"
Location = "Rotterdam"
Start = "2018"
End.nl = "heden"
End.en = "present"

Situation.nl = """
Eén van de centrale onderdelen van het Digitaal Stelsel Omgevingswet, is de \
Toepasbare Regels component. Deze applicatie ontvangt regelgeving afkomstig van \
gemeentes, provinciën, waterschappen en het rijk, in een open standaard \
formaat. Met deze regels worden automatisch dynamische vragenlijsten opgesteld \
voor de eindgebruikers. De ingevulde vragen worden realtime doorgerekend door \
een rule-engine, en leiden tot een advies of vergunningaanvraag. Deze \
functionaliteit wordt aangeboden op het landelijke Omgevingswet loket, maar is \
ook d.m.v. open REST API's te gebruiken door iedereen die hier functionaliteit \
op wil bouwen.
Vanwege het publieke karakter en de grote gebruikersgroep worden er hoge eisen  \
gesteld aan betrouwbaarheid, beschikbaarheid, veiligheid en schaalbaarheid. 
In de loop der tijd heb ik me ontwikkeld tot de meest ervaren ontwikkelaar op \
dit project. D.m.v. kennisoverdracht, code reviews en coaching heb ik \
nieuwe ontwikkelaars snel wegwijs kunnen maken in de materie, en heb ik dit \
project in goede handen kunnen achterlaten.
"""
Situation.en = """
One of the core components of the Digital System for the Environmental Act is \
the Applicable Rules module. This application receives legislation from \
municipalities, provinces, water authorities, and the national government in an \
open standard format. These rules are used to automatically generate dynamic \
questionnaires for end users. Completed questionnaires are evaluated in \
real-time by a rule engine, resulting in advice or a permit application. This \
functionality is offered on the national Environmental Act portal and is also \
available via open REST APIs for anyone wanting to build on this functionality.
Due to its public nature and large user base, high demands are placed on \
reliability, availability, security, and scalability.
Over time I developed into the most experienced developer on this project. \
Through knowledge transfer, code reviews, and coaching I was able to quickly \
bring new developers up to speed and leave the project in good hands.
"""

